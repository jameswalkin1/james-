# Bot configuration. Safe to commit - secrets live in .env, which is gitignored.

# Execution mode:
#   signal = analyse and notify only, never places an order  <-- start here
#   auto   = place and manage orders automatically
mode: signal

# Which venue to trade through:
#   oanda = v20 REST API. Needs an OANDA fxTrade account (id like 101-004-...).
#           Runs anywhere, including a cheap Linux VPS.
#   mt5   = MetaTrader 5 terminal. Works with Vantage, OANDA's MT5 accounts and
#           most EU brokers. Requires Windows with the terminal running.
broker: oanda

# Universe. 14 liquid pairs spread across 8 currencies.
#
# The spread across currencies is the point. An all-USD-crossed universe makes
# max_per_currency bind on USD constantly, which throttled this strategy to ~29
# trades/year while discarding ~170 valid signals. Diversifying the currencies
# lets the cap do its real job - stopping correlated bets - instead of acting as
# a blanket position limit.
#
# Crosses whose P&L lands in a third currency (EUR_GBP earns GBP on a USD
# account) are converted via src/rates.py. Run `fetch` and it downloads any
# extra conversion series automatically.
instruments:
  # USD majors
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - AUD_USD
  - USD_CAD
  - USD_CHF
  - NZD_USD
  # non-USD crosses - these are what unblock the currency cap
  - EUR_GBP
  - EUR_JPY
  - GBP_JPY
  - AUD_JPY
  - AUD_NZD
  - EUR_AUD
  - CAD_JPY

granularity: D          # D = daily bars. H4 also works; expect more trades and more cost drag.
account_currency: USD
starting_equity: 10000  # used by the backtester only; live equity comes from the broker

strategy:
  entry_period: 20      # breakout lookback
  exit_period: 10       # opposite channel that closes a trade
  trend_ema: 100        # regime filter
  atr_period: 20
  stop_atr_mult: 2.0    # initial stop, in ATRs
  trail_atr_mult: 3.0   # trailing stop distance, in ATRs

risk:
  risk_per_trade: 0.005    # 0.5% of equity per trade
  # NOTE: these two are coupled. Every position costs risk_per_trade of the
  # portfolio budget, so max_portfolio_risk / risk_per_trade is its own position
  # limit. 6 x 0.5% = 3.0%, so both caps bite at the same point - raise them
  # together or the change does nothing. The bot warns if you get this wrong.
  max_open_positions: 6
  max_portfolio_risk: 0.03 # 3% total open risk
  max_per_currency: 2      # stops stacking one currency bet across pairs
  daily_loss_limit: 0.03   # -3% on the day -> flatten and stand down
